<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Material Hub - Himanshu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --ncert-maroon: #8e244d; 
            --ncert-blue: #1b2943; 
            --light-gray: #f4f7f6; 
            --success-green: #16a34a;
        }
        
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; 
            background: var(--light-gray); 
            color: #333;
        }

        /* Top Header */
        .top-header { 
            background: #fff; 
            padding: 10px 5%; 
            display: flex; 
            align-items: center; 
            border-bottom: 4px solid var(--ncert-maroon);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .logo-img { height: 50px; margin-right: 15px; border-radius: 5px; }
        .header-text h1 { color: var(--ncert-maroon); margin: 0; font-size: 22px; }
        .header-text p { margin: 0; font-size: 14px; font-weight: bold; color: #666; }

        /* Main Container */
        .main-container { 
            max-width: 1000px; 
            margin: 30px auto; 
            padding: 0 20px;
        }

        /* Book Detail Card (As per your screenshot) */
        .book-card { 
            background: #fff; 
            border-radius: 12px; 
            overflow: hidden; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }
        .book-info-section { 
            display: flex; 
            padding: 25px; 
            background: #fafafa; 
            border-bottom: 1px solid #eee;
            gap: 25px;
            align-items: center;
            position: relative;
        }
        .book-cover { 
            width: 140px; 
            height: 190px; 
            object-fit: cover; 
            border-radius: 8px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }
        .book-details h2 { margin: 0 0 10px 0; color: #222; }
        .book-details p { margin: 5px 0; color: #666; font-weight: 500; }
        
        .full-download-btn {
            position: absolute;
            top: 25px;
            right: 25px;
            background: var(--success-green);
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        /* Chapter List */
        .chapter-list { padding: 10px 20px; }
        .chapter-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 15px 0; 
            border-bottom: 1px solid #f0f0f0; 
        }
        .chapter-row:last-child { border-bottom: none; }
        .chapter-name { font-weight: 500; font-size: 15px; }
        
        .action-btns { display: flex; gap: 10px; }
        .btn { 
            padding: 7px 14px; 
            border-radius: 4px; 
            text-decoration: none; 
            font-size: 13px; 
            font-weight: bold; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
        }
        .btn-open { background: #e8f5e9; color: var(--success-green); border: 1px solid var(--success-green); }
        .btn-pdf { background: #1b2943; color: white; }

        .back-nav { margin-bottom: 15px; }
        .back-nav button { 
            background: none; border: 1px solid #ccc; padding: 5px 15px; 
            border-radius: 4px; cursor: pointer; font-weight: bold; 
        }

        @media (max-width: 600px) {
            .book-info-section { flex-direction: column; text-align: center; }
            .full-download-btn { position: static; margin-top: 15px; }
            .chapter-row { flex-direction: column; gap: 10px; text-align: center; }
        }
    </style>
</head>
<body>

    <header class="top-header">
        <img src="logo.png" alt="Logo" class="logo-img" onerror="this.src='https://via.placeholder.com/50?text=Hub'">
        <div class="header-text">
            <h1>Study Material Hub</h1>
            <p>Himanshu Chaudhary | NCERT Library</p>
        </div>
    </header>

    <div class="main-container">
        <div class="back-nav">
            <button onclick="alert('Main Page functionality will go here')">← Back</button>
        </div>

        <div class="book-card">
            <div class="book-info-section">
                <img id="bookImg" src="https://ncert.nic.in/textbook/pdf/khah1cc.jpg" alt="Aaroh" class="book-cover">
                <div class="book-details">
                    <h2 id="bookTitle">Aaroh (Hindi Textbook)</h2>
                    <p>Class 11 | NCERT PDF</p>
                </div>
                <a id="zipLink" href="https://drive.google.com/drive/folders/1M7DRGrQ-ve5jlGQrmTxkSw-Ee6FPDk-J?usp=sharing" target="_blank" class="full-download-btn">
                    <i class="fa-solid fa-file-zipper"></i> FULL BOOK
                </a>
            </div>

            <div class="chapter-list" id="chaptersContainer">
                </div>
        </div>
    </div>

    <script>
        const hindiChapters = [
            { name: "Index (Syllabus)", link: "https://drive.google.com/file/d/1tL1S98oK7uE9m9Uf4z-7v8_N-kO3q9mX/view?usp=sharing" },
            { name: "Chapter 1: Premchand", link: "https://drive.google.com/file/d/1vH_2o_pL4hU5Y2i_3q_K6x9k5mN-P8vD/view?usp=sharing" },
            { name: "Chapter 2: Krishna Sobti", link: "https://drive.google.com/file/d/1X5_2p_nL4hU5Y2i_3q_K6x9k5mN-P8vD/view?usp=sharing" },
            { name: "Chapter 3: Satyajit Ray", link: "https://drive.google.com/file/d/1Z5_2p_nL4hU5Y2i_3q_K6x9k5mN-P8vD/view?usp=sharing" },
            { name: "Chapter 4: Balmukund Gupta", link: "https://drive.google.com/file/d/1b5_2p_nL4hU5Y2i_3q_K6x9k5mN-P8vD/view?usp=sharing" },
            { name: "Chapter 5: Shekhar Joshi", link: "https://drive.google.com/file/d/1d5_2p_nL4hU5Y2i_3q_K6x9k5mN-P8vD/view?usp=sharing" },
            { name: "Chapter 6: Mannu Bhandari", link: "https://drive.google.com/file/d/1f5_2p_nL4hU5Y2i_3q_K6x9k5mN-P8vD/view?usp=sharing" },
            { name: "Chapter 9: Kabir", link: "https://drive.google.com/file/d/1l5_2p_nL4hU5Y2i_3q_K6x9k5mN-P8vD/view?usp=sharing" },
            { name: "Chapter 12: Trilochan", link: "https://drive.google.com/file/d/1r5_2p_nL4hU5Y2i_3q_K6x9k5mN-P8vD/view?usp=sharing" },
            { name: "Chapter 14: Dushyant Kumar", link: "https://drive.google.com/file/d/1v5_2p_nL4hU5Y2i_3q_K6x9k5mN-P8vD/view?usp=sharing" },
            { name: "Chapter 15: Akka Mahadevi", link: "https://drive.google.com/file/d/1x5_2p_nL4hU5Y2i_3q_K6x9k5mN-P8vD/view?usp=sharing" },
            { name: "Chapter 16: Paash", link: "https://drive.google.com/file/d/1z5_2p_nL4hU5Y2i_3q_K6x9k5mN-P8vD/view?usp=sharing" }
        ];

        function renderChapters() {
            const container = document.getElementById('chaptersContainer');
            container.innerHTML = '';

            hindiChapters.forEach(ch => {
                const row = document.createElement('div');
                row.className = 'chapter-row';
                row.innerHTML = `
                    <span class="chapter-name">${ch.name}</span>
                    <div class="action-btns">
                        <a href="${ch.link}" target="_blank" class="btn btn-open"><i class="fa-solid fa-eye"></i> OPEN</a>
                        <a href="${ch.link}" target="_blank" class="btn btn-pdf"><i class="fa-solid fa-file-pdf"></i> PDF</a>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        // Initialize
        window.onload = renderChapters;
    </script>
</body>
</html>
